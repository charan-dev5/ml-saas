{% extends 'base.html' %}
{% block content %}
<h1>Welcome to ML Predict</h1>
<a href="/logout">Logout</a>
<form method="POST" enctype="multipart/form-data">
<input type="file" name="file">
<button type="submit">submit</button>
</form>

{% if predictions %}
<table>
    <tr><th>Prediction</th></tr>
    {% for item in predictions %}
    <tr><td>{{ item }}</td></tr>
    {% endfor %}
</table>
{% endif %}

{% endblock %}
